<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img"><title>Measurement-only synthesis latency</title><desc>No temperature aborts or cooldown waits. Bars are medians, dots are actual warm requests. Different backends generated different speech codes.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif">
